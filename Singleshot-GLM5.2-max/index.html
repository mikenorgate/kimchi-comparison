<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>macOS Tahoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/macos.css">
</head>
<body>
  <!-- Boot screen -->
  <div id="boot-screen">
    <div class="boot-logo">
      <svg viewBox="0 0 170 170" width="64" height="64"><path fill="#fff" d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.96-3.17-14.33-3.17-4.58 0-9.49 1.05-14.74 3.17-5.25 2.13-9.48 3.24-12.71 3.35-4.93.21-9.84-1.96-14.75-6.52-3.13-2.73-7.04-7.41-11.72-14.04-5.02-7.08-9.15-15.29-12.39-24.66-3.46-10.07-5.19-19.81-5.19-29.21 0-10.82 2.34-20.14 7.03-27.94a41.0 41.0 0 0 1 14.58-14.93A39.2 39.2 0 0 1 49.04 48c3.89 0 8.99 1.2 15.32 3.57 6.32 2.37 10.38 3.57 12.16 3.57 1.33 0 5.84-1.4 13.49-4.21 7.23-2.61 13.33-3.69 18.31-3.26 13.54 1.09 23.72 6.42 30.49 16.01-12.12 7.35-18.1 17.65-17.94 30.86.15 10.29 3.84 18.84 11.06 25.61a36.3 36.3 0 0 0 11.06 7.25c-.89 2.57-1.82 5.04-2.82 7.41zM119.11 7.24c0 8.07-2.95 15.6-8.82 22.55-7.09 8.28-15.66 13.05-24.95 12.3a25.1 25.1 0 0 1-.19-3.06c0-7.74 3.37-16.03 9.35-22.81a38.6 38.6 0 0 1 12.3-9.64c4.96-2.41 9.65-3.74 14.06-3.98.13 1.11.18 2.23.18 3.33z"/></svg>
    </div>
    <div class="boot-progress"><div class="boot-progress-bar"></div></div>
  </div>

  <!-- Desktop -->
  <div id="desktop" class="hidden">
    <!-- Desktop wallpaper handled via CSS -->
    <div id="desktop-icons"></div>

    <!-- Menu Bar -->
    <div id="menubar">
      <div class="menubar-left">
        <div class="mb-item mb-apple" data-menu="apple">
          <svg viewBox="0 0 170 170" width="15" height="15"><path fill="currentColor" d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.96-3.17-14.33-3.17-4.58 0-9.49 1.05-14.74 3.17-5.25 2.13-9.48 3.24-12.71 3.35-4.93.21-9.84-1.96-14.75-6.52-3.13-2.73-7.04-7.41-11.72-14.04-5.02-7.08-9.15-15.29-12.39-24.66-3.46-10.07-5.19-19.81-5.19-29.21 0-10.82 2.34-20.14 7.03-27.94a41.0 41.0 0 0 1 14.58-14.93A39.2 39.2 0 0 1 49.04 48c3.89 0 8.99 1.2 15.32 3.57 6.32 2.37 10.38 3.57 12.16 3.57 1.33 0 5.84-1.4 13.49-4.21 7.23-2.61 13.33-3.69 18.31-3.26 13.54 1.09 23.72 6.42 30.49 16.01-12.12 7.35-18.1 17.65-17.94 30.86.15 10.29 3.84 18.84 11.06 25.61a36.3 36.3 0 0 0 11.06 7.25c-.89 2.57-1.82 5.04-2.82 7.41zM119.11 7.24c0 8.07-2.95 15.6-8.82 22.55-7.09 8.28-15.66 13.05-24.95 12.3a25.1 25.1 0 0 1-.19-3.06c0-7.74 3.37-16.03 9.35-22.81a38.6 38.6 0 0 1 12.3-9.64c4.96-2.41 9.65-3.74 14.06-3.98.13 1.11.18 2.23.18 3.33z"/></svg>
        </div>
        <div class="mb-item mb-bold" data-menu="app-name">Finder</div>
        <div class="mb-item" data-menu="file">File</div>
        <div class="mb-item" data-menu="edit">Edit</div>
        <div class="mb-item" data-menu="view">View</div>
        <div class="mb-item" data-menu="window">Window</div>
        <div class="mb-item" data-menu="help">Help</div>
      </div>
      <div class="menubar-right">
        <div class="mb-item mb-icon" id="mb-battery" title="Battery">
          <svg viewBox="0 0 28 14" width="26" height="13"><rect x="1" y="2" width="22" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/><rect x="3" y="4" width="16" height="6" rx="1" fill="currentColor"/><rect x="24" y="5" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg>
        </div>
        <div class="mb-item mb-icon" id="mb-wifi" title="Wi‑Fi">
          <svg viewBox="0 0 18 14" width="17" height="13"><path fill="currentColor" d="M9 12.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/><path fill="currentColor" opacity="0.9" d="M3.1 7.4a8.3 8.3 0 0 1 11.8 0l-1.5 1.5a6.2 6.2 0 0 0-8.8 0L3.1 7.4z"/><path fill="currentColor" opacity="0.6" d="M.6 4.9a11.9 11.9 0 0 1 16.8 0l-1.5 1.5a9.8 9.8 0 0 0-13.8 0L.6 4.9z"/></svg>
        </div>
        <div class="mb-item mb-icon" id="mb-spotlight" title="Spotlight Search">
          <svg viewBox="0 0 16 16" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M10.5 10.5 14 14M7 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></svg>
        </div>
        <div class="mb-item mb-icon" id="mb-control-center" title="Control Center">
          <svg viewBox="0 0 18 18" width="17" height="17"><rect x="1" y="1" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="1" width="7" height="7" rx="3.5" fill="currentColor"/><rect x="1" y="10" width="7" height="7" rx="3.5" fill="currentColor"/><rect x="10" y="10" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </div>
        <div class="mb-item mb-icon" id="mb-siri" title="Siri">
          <svg viewBox="0 0 18 18" width="16" height="16"><circle cx="9" cy="9" r="8" fill="none" stroke="url(#siriGrad)" stroke-width="2"/><defs><linearGradient id="siriGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5e62"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs></svg>
        </div>
        <div class="mb-item mb-datetime" id="mb-datetime"></div>
      </div>
    </div>

    <!-- Dropdown menu -->
    <div id="menu-dropdown" class="hidden"></div>

    <!-- Control Center -->
    <div id="control-center" class="hidden"></div>

    <!-- Spotlight -->
    <div id="spotlight" class="hidden">
      <div class="spotlight-box">
        <div class="spotlight-input-wrap">
          <svg viewBox="0 0 16 16" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M10.5 10.5 14 14M7 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/></svg>
          <input id="spotlight-input" type="text" placeholder="Spotlight Search" autocomplete="off" spellcheck="false">
        </div>
        <div class="spotlight-tabs">
          <button class="sp-tab active" data-tab="apps">Apps</button>
          <button class="sp-tab" data-tab="files">Files</button>
          <button class="sp-tab" data-tab="calc">Calculator</button>
          <button class="sp-tab" data-tab="actions">Actions</button>
        </div>
        <div id="spotlight-results"></div>
      </div>
    </div>

    <!-- Launchpad -->
    <div id="launchpad" class="hidden">
      <div id="launchpad-grid"></div>
    </div>

    <!-- Notification center / widgets -->
    <div id="notif-center" class="hidden"></div>

    <!-- Windows container -->
    <div id="windows-layer"></div>

    <!-- Dock -->
    <div id="dock-container">
      <div id="dock"></div>
    </div>
  </div>

  <script src="js/apps.js"></script>
  <script src="js/os.js"></script>
</body>
</html>
