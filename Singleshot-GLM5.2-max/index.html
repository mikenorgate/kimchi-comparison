                <div class="ma-artist">${a.artist}</div>
              </div>
            `).join('')}
          </div>
          <div class="music-section-title">Songs</div>
          <div style="display:flex;flex-direction:column">
            ${songs.map((s,i) => `
              <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer" data-song="${i}">
                <div style="width:32px;height:32px;border-radius:6px;background:${s.color};display:flex;align-items:center;justify-content:center"><i class="fas fa-music" style="color:rgba(255,255,255,0.5);font-size:12px"></i></div>
                <div style="flex:1"><div style="font-size:13px;font-weight:500">${s.title}</div><div style="font-size:11px;color:var(--text-secondary)">${s.artist}</div></div>
                <div style="font-size:12px;color:var(--text-secondary)">3:${20+i*5}</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="music-player">
          <div class="mp-cover" style="background:${current.color}"><i class="fas fa-music" style="color:rgba(255,255,255,0.5);font-size:18px"></i></div>
          <div class="mp-info">
            <div class="mp-title">${current.title}</div>
            <div class="mp-artist">${current.artist}</div>
            <div class="music-progress" id="music-progress"><div class="mp-fill" style="width:${State.musicProgress}%"></div></div>
          </div>
          <div class="mp-btns">
            <button class="mp-btn" id="music-prev"><i class="fas fa-backward-step"></i></button>
            <button class="mp-btn play" id="music-play"><i class="fas ${State.musicPlaying?'fa-pause':'fa-play'}"></i></button>
            <button class="mp-btn" id="music-next"><i class="fas fa-forward-step"></i></button>
          </div>
        </div>
      </div>
    `;
    
    function togglePlay() {
      State.musicPlaying = !State.musicPlaying;
      const btn = el.querySelector('#music-play');
      if (btn) btn.innerHTML = `<i class="fas ${State.musicPlaying?'fa-pause':'fa-play'}"></i>`;
      if (State.musicPlaying) {
        State.musicTimer = setInterval(() => {
          State.musicProgress += 0.5;
          if (State.musicProgress >= 100) { State.musicProgress = 0; nextSong(); }
          const fill = el.querySelector('.mp-fill');
          if (fill) fill.style.width = State.musicProgress + '%';
        }, 200);
      } else {
        clearInterval(State.musicTimer);
      }
    }
    
    function nextSong() {
      State.musicCurrent = (State.musicCurrent + 1) % songs.length;
      State.musicProgress = 0;
      this_render();
    }
    
    function prevSong() {
      State.musicCurrent = (State.musicCurrent - 1 + songs.length) % songs.length;
      State.musicProgress = 0;
      this_render();
    }
    
    const self = this;
    function this_render() { self.render(el, win); if (State.musicPlaying) { const btn = el.querySelector('#music-play'); if (btn) btn.innerHTML = '<i class="fas fa-pause"></i>'; State.musicTimer = setInterval(()=>{ State.musicProgress += 0.5; if(State.musicProgress>=100){State.musicProgress=0;nextSong();} const fill=el.querySelector('.mp-fill'); if(fill) fill.style.width=State.musicProgress+'%'; }, 200); } }
    
    el.querySelector('#music-play').addEventListener('click', togglePlay);
    el.querySelector('#music-next').addEventListener('click', nextSong);
    el.querySelector('#music-prev').addEventListener('click', prevSong);
    el.querySelectorAll('[data-song]').forEach(s => {
      s.addEventListener('click', () => { State.musicCurrent = parseInt(s.dataset.song); State.musicProgress = 0; State.musicPlaying = true; this_render(); });
    });
    
    // Resume playing if was playing
    if (State.musicPlaying) {
      State.musicTimer = setInterval(() => {
        State.musicProgress += 0.5;
        if (State.musicProgress >= 100) { State.musicProgress = 0; nextSong(); }
        const fill = el.querySelector('.mp-fill');
        if (fill) fill.style.width = State.musicProgress + '%';
      }, 200);
    }
  }
});

function toggleMusic(win) {
  if (!win) return;
  const btn = win.contentEl.querySelector('#music-play');
  if (btn) btn.click();
}
function nextSong(win) {
  if (!win) return;
  const btn = win.contentEl.querySelector('#music-next');
  if (btn) btn.click();
}
function prevSong(win) {
  if (!win) return;
  const btn = win.contentEl.querySelector('#music-prev');
  if (btn) btn.click();
}

registerApp('messages', {
  title:'Messages', singleInstance:true, defaultWidth:750, defaultHeight:520,
  menus:[
    { label:'File', items:[{label:'New Message', action:()=>showNotification('fa-comment','#30d158','Messages','New message'), shortcut:'⌘N'},{label:'Close', action:()=>{const w=State.activeWindow;if(w)closeWindow(w);}, shortcut:'⌘W'}] },
    { label:'Edit', items:[{label:'Undo', action:()=>document.execCommand('undo'),shortcut:'⌘Z'},{label:'Find', action:()=>{}, shortcut:'⌘F'}] },
    { label:'View', items:[{label:'Enter Full Screen', action:()=>{const w=State.activeWindow;if(w)toggleMaximize(w);},shortcut:'⌃⌘F'}] },
    { label:'Window', items:[{label:'Minimize', action:()=>{const w=State.activeWindow;if(w)minimizeWindow(w);},shortcut:'⌘M'}] },
    { label:'Help', items:[{label:'Messages Help', action:()=>showNotification('fa-question-circle','#0a84ff','Help','Messages Help')}] },
  ],
  render(el, win) {
    const convs = State.messages;
    let activeChat = State.currentChat;
    
    function renderChat() {
      const chat = convs.find(c => c.id === activeChat) || convs[0];
      const body = el.querySelector('.messages-body');
      body.innerHTML = chat.msgs.map(m => `<div class="msg-bubble ${m.s}">${m.t}</div>`).join('');
      body.scrollTop = body.scrollHeight;
      el.querySelector('.messages-header').textContent = chat.name;
    }
    
    el.innerHTML = `
      <div class="messages">
        <div class="messages-sidebar">
          ${convs.map(c => `
            <div class="messages-item ${c.id===activeChat?'active':''}" data-id="${c.id}">
              <div class="mi-avatar" style="background:${c.avatar}">${c.name.charAt(0)}</div>
              <div class="mi-info">
                <div class="mi-top"><span class="mi-name">${c.name}</span><span class="mi-time">${c.time}</span></div>
                <div class="mi-last">${c.last}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="messages-chat">
          <div class="messages-header">${convs.find(c=>c.id===activeChat)?.name || ''}</div>
          <div class="messages-body"></div>
          <div class="messages-input">
            <input type="text" placeholder="iMessage" id="msg-input">
            <button id="msg-send"><i class="fas fa-arrow-up"></i></button>
          </div>
        </div>
      </div>
    `;
    
    renderChat();
    
    el.querySelectorAll('.messages-item').forEach(item => {
      item.addEventListener('click', () => {
        activeChat = parseInt(item.dataset.id);
        State.currentChat = activeChat;
        el.querySelectorAll('.messages-item').forEach(x => x.classList.remove('active'));
        item.classList.add('active');
        renderChat();
      });
    });
    
    const input = el.querySelector('#msg-input');
    function send() {
      const text = input.value.trim();
      if (!text) return;
      const chat = convs.find(c => c.id === activeChat);
      chat.msgs.push({s:'sent', t:text});
      chat.last = text;
      input.value = '';
      renderChat();
      
      // Auto-reply
      setTimeout(() => {
        const replies = ['That sounds great!','Cool!','Let me think about it.','Sure, no problem.','Thanks for letting me know!','Interesting...','I agree!','Haha that\'s funny 😄'];
        chat.msgs.push({s:'received', t:replies[Math.floor(Math.random()*replies.length)]});
        chat.last = chat.msgs[chat.msgs.length-1].t;
        renderChat();
        // Update sidebar
        el.querySelectorAll('.messages-item').forEach(item => {
          if (parseInt(item.dataset.id) === activeChat) {
            item.querySelector('.mi-last').textContent = chat.last;
          }
        });
      }, 1500 + Math.random() * 2000);
    }
    
    el.querySelector('#msg-send').addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  }
});

              <div class="clock-hand hour" id="ch-hour"></div>
              <div class="clock-hand minute" id="ch-minute"></div>
              <div class="clock-hand second" id="ch-second"></div>
              <div class="clock-center"></div>
            </div>
            <div class="clock-digital" id="cd-time"></div>
            <div class="clock-cities" style="width:100%;margin-top:20px">
              ${cities.map(c => {
                const t = new Date(now.getTime() + (c.offset * 3600000) - (now.getTimezoneOffset() * 60000));
                return `<div class="clock-city"><div><div class="cc-name">${c.name}</div><div class="cc-offset">UTC${c.offset>=0?'+':''}${c.offset}</div></div><div class="cc-time">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</div></div>`;
              }).join('')}
            </div>
          </div>
        `;
        
        function updateClock() {
          const n = new Date();
          const h = n.getHours() % 12;
          const m = n.getMinutes();
          const s = n.getSeconds();
          const hourEl = el.querySelector('#ch-hour');
          const minEl = el.querySelector('#ch-minute');
          const secEl = el.querySelector('#ch-second');
          const digEl = el.querySelector('#cd-time');
          if (hourEl) hourEl.style.transform = `rotate(${h*30 + m*0.5}deg)`;
          if (minEl) minEl.style.transform = `rotate(${m*6}deg)`;
          if (secEl) secEl.style.transform = `rotate(${s*6}deg)`;
          if (digEl) { const hh = n.getHours(); digEl.textContent = `${String(hh).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
        }
        updateClock();
        clearInterval(win._clockTimer);
        win._clockTimer = setInterval(updateClock, 1000);
      } else if (activeTab === 'stopwatch') {
        content.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:30px;padding:40px"><div style="font-size:64px;font-weight:200" id="sw-display">00:00.0</div><div style="display:flex;gap:12px"><button class="ct-btn" id="sw-start" style="background:var(--accent);color:#fff;padding:8px 24px">Start</button><button class="ct-btn" id="sw-lap" style="padding:8px 24px">Lap</button><button class="ct-btn" id="sw-reset" style="padding:8px 24px">Reset</button></div><div id="sw-laps" style="width:100%;max-width:300px"></div></div>`;
        let swTime = 0, swRunning = false, swTimer = null;
        const display = el.querySelector('#sw-display');
        el.querySelector('#sw-start').addEventListener('click', () => {
          swRunning = !swRunning;
          el.querySelector('#sw-start').textContent = swRunning ? 'Stop' : 'Start';
          if (swRunning) {
            swTimer = setInterval(() => {
              swTime += 100;
              const mins = Math.floor(swTime / 60000);
              const secs = Math.floor((swTime % 60000) / 1000);
              const tenths = Math.floor((swTime % 1000) / 100);
              display.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${tenths}`;
            }, 100);
          } else { clearInterval(swTimer); }
        });
        el.querySelector('#sw-reset').addEventListener('click', () => { swTime = 0; swRunning = false; clearInterval(swTimer); display.textContent = '00:00.0'; el.querySelector('#sw-start').textContent = 'Start'; el.querySelector('#sw-laps').innerHTML = ''; });
        el.querySelector('#sw-lap').addEventListener('click', () => { if (swRunning) { const laps = el.querySelector('#sw-laps'); laps.innerHTML = `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--separator)"><span>Lap</span><span>${display.textContent}</span></div>` + laps.innerHTML; } });
      } else if (activeTab === 'timer') {
        content.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:30px;padding:40px"><div style="font-size:64px;font-weight:200" id="tm-display">00:00:00</div><div style="display:flex;gap:12px"><input type="number" id="tm-mins" placeholder="Min" style="width:60px;height:32px;text-align:center;border-radius:8px;border:0.5px solid var(--separator);background:rgba(255,255,255,0.1);color:var(--text-primary);font-size:14px;outline:none"><button class="ct-btn" id="tm-start" style="background:var(--accent);color:#fff;padding:8px 24px">Start</button><button class="ct-btn" id="tm-reset" style="padding:8px 24px">Reset</button></div></div>`;
        let tmTime = 0, tmRunning = false, tmTimer = null;
        const display = el.querySelector('#tm-display');
        el.querySelector('#tm-start').addEventListener('click', () => {
          if (!tmRunning) {
            const mins = parseInt(el.querySelector('#tm-mins').value) || 0;
            tmTime = mins * 60000;
            tmRunning = true;
            el.querySelector('#tm-start').textContent = 'Pause';
            tmTimer = setInterval(() => {
              tmTime -= 1000;
              if (tmTime <= 0) { clearInterval(tmTimer); tmRunning = false; display.textContent = '00:00:00'; el.querySelector('#tm-start').textContent = 'Start'; showNotification('fa-bell','#ff453a','Timer','Time\'s up!'); return; }
              const h = Math.floor(tmTime / 3600000);
              const m = Math.floor((tmTime % 3600000) / 60000);
              const s = Math.floor((tmTime % 60000) / 1000);
              display.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
          } else {
            clearInterval(tmTimer); tmRunning = false; el.querySelector('#tm-start').textContent = 'Resume';
          }
        });
        el.querySelector('#tm-reset').addEventListener('click', () => { clearInterval(tmTimer); tmRunning = false; tmTime = 0; display.textContent = '00:00:00'; el.querySelector('#tm-start').textContent = 'Start'; });
      }
    }
    
    el.innerHTML = `
      <div class="clock-app">
        <div class="clock-tabs">
          <div class="clock-tab ${activeTab==='world'?'active':''}" data-tab="world">World Clock</div>
          <div class="clock-tab ${activeTab==='timer'?'active':''}" data-tab="timer">Timer</div>
          <div class="clock-tab ${activeTab==='stopwatch'?'active':''}" data-tab="stopwatch">Stopwatch</div>
        </div>
        <div class="clock-content"></div>
      </div>
    `;
    
    el.querySelectorAll('.clock-tab').forEach(t => {
      t.addEventListener('click', () => {
        activeTab = t.dataset.tab;
        el.querySelectorAll('.clock-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        renderTab();
      });
    });
    renderTab();
  }
});

// --- Reminders ---
registerApp('reminders', {
  title:'Reminders', singleInstance:true, defaultWidth:500, defaultHeight:480,
  menus:[
    { label:'File', items:[{label:'New Reminder', action:()=>{}, shortcut:'⌘N'},{label:'New List', action:()=>{}, shortcut:'⇧⌘N'},{label:'Close', action:()=>{const w=State.activeWindow;if(w)closeWindow(w);}, shortcut:'⌘W'}] },
    { label:'Edit', items:[{label:'Undo', action:()=>document.execCommand('undo'),shortcut:'⌘Z'}] },
    { label:'View', items:[{label:'Enter Full Screen', action:()=>{const w=State.activeWindow;if(w)toggleMaximize(w);},shortcut:'⌃⌘F'}] },
    { label:'Window', items:[{label:'Minimize', action:()=>{const w=State.activeWindow;if(w)minimizeWindow(w);},shortcut:'⌘M'}] },
    { label:'Help', items:[{label:'Reminders Help', action:()=>showNotification('fa-question-circle','#0a84ff','Help','Reminders Help')}] },
  ],
  render(el, win) {
    const lists = Object.keys(State.reminders);
    const currentList = State.currentReminderList;
    const items = State.reminders[currentList] || [];
    
    el.innerHTML = `
      <div class="reminders">
        <div class="reminders-lists">
          ${lists.map(l => `<div class="reminders-list-tab ${l===currentList?'active':''}" data-list="${l}">${l}</div>`).join('')}
        </div>
        <div class="reminders-content">
          <h2 style="font-size:22px;margin-bottom:16px">${currentList}</h2>
          ${items.map(r => `
            <div class="reminder-item">
              <div class="reminder-check ${r.done?'done':''}" data-id="${r.id}"></div>
              <div class="reminder-text ${r.done?'done':''}">${r.text}</div>
            </div>
          `).join('')}
          <div class="reminder-add">
            <input type="text" placeholder="Add a reminder" id="rem-add-input">
            <button id="rem-add-btn">Add</button>
          </div>
        </div>
      </div>
    `;
    
    el.querySelectorAll('.reminder-check').forEach(c => {
      c.addEventListener('click', () => {
        const id = parseInt(c.dataset.id);
        const r = State.reminders[currentList].find(x => x.id === id);
        if (r) { r.done = !r.done; this.render(el, win); }
      });
    });
    
    el.querySelectorAll('.reminders-list-tab').forEach(t => {
      t.addEventListener('click', () => {
        State.currentReminderList = t.dataset.list;
        this.render(el, win);
      });
    });
    
    function addReminder() {
      const input = el.querySelector('#rem-add-input');
      const text = input.value.trim();
      if (!text) return;
      const newId = Math.max(0, ...State.reminders[currentList].map(r => r.id)) + 1;
      State.reminders[currentList].push({ id:newId, text, done:false });
      input.value = '';
      APPS.reminders.render(el, win);
    }
    
    el.querySelector('#rem-add-btn').addEventListener('click', addReminder);
    el.querySelector('#rem-add-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') addReminder(); });
  }
});

// --- Stickies ---
registerApp('stickies', {
  title:'Stickies', singleInstance:true, defaultWidth:600, defaultHeight:420,
  menus:[
    { label:'File', items:[{label:'New Note', action:()=>{State.stickies.push({id:Date.now(),color:'#ffe66d',text:''});if(State.activeWindow)APPS.stickies.render(State.activeWindow.contentEl,State.activeWindow);}, shortcut:'⌘N'},{label:'Close', action:()=>{const w=State.activeWindow;if(w)closeWindow(w);}, shortcut:'⌘W'}] },
    { label:'Edit', items:[{label:'Undo', action:()=>document.execCommand('undo'),shortcut:'⌘Z'}] },
    { label:'View', items:[{label:'Enter Full Screen', action:()=>{const w=State.activeWindow;if(w)toggleMaximize(w);},shortcut:'⌃⌘F'}] },
    { label:'Window', items:[{label:'Minimize', action:()=>{const w=State.activeWindow;if(w)minimizeWindow(w);},shortcut:'⌘M'}] },
    { label:'Help', items:[{label:'Stickies Help', action:()=>showNotification('fa-question-circle','#0a84ff','Help','Stickies Help')}] },
  ],
  render(el, win) {
    el.innerHTML = `
      <div class="stickies">
        ${State.stickies.map(s => `
          <div class="sticky-note" style="background:${s.color}" data-id="${s.id}">
            <textarea class="sn-text" style="color:${s.color==='#ffe66d'||s.color==='#ff6b6b'?'#5a4a00':'#fff'}">${s.text}</textarea>
          </div>
        `).join('')}
      </div>
    `;
    
    el.querySelectorAll('.sn-text').forEach(t => {
      t.addEventListener('input', () => {
        const note = t.closest('.sticky-note');
        const id = parseInt(note.dataset.id);
        const s = State.stickies.find(x => x.id === id);
        if (s) s.text = t.value;
      });
      t.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const note = t.closest('.sticky-note');
        const id = parseInt(note.dataset.id);
        showContextMenu(e.clientX, e.clientY, [
          {label:'Yellow', action:()=>{const s=State.stickies.find(x=>x.id===id);if(s){s.color='#ffe66d';this.render(el,win);}}},
          {label:'Pink', action:()=>{const s=State.stickies.find(x=>x.id===id);if(s){s.color='#ff6b6b';this.render(el,win);}}},
          {label:'Blue', action:()=>{const s=State.stickies.find(x=>x.id===id);if(s){s.color='#4ecdc4';this.render(el,win);}}},
          {label:'Green', action:()=>{const s=State.stickies.find(x=>x.id===id);if(s){s.color='#30d158';this.render(el,win);}}},
          {label:'Purple', action:()=>{const s=State.stickies.find(x=>x.id===id);if(s){s.color='#bf5af2';this.render(el,win);}}},
          {divider:true},
          {label:'Delete Note', action:()=>{State.stickies=State.stickies.filter(x=>x.id!==id);this.render(el,win);}},
        ]);
      });
    });
  }
});
