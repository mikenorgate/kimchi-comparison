<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>macOS Tahoe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Boot Screen -->
    <div id="boot-screen">
        <div class="boot-logo"></div>
        <div class="boot-progress"><div class="boot-progress-bar"></div></div>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        <!-- Wallpaper -->
        <div id="wallpaper"></div>

        <!-- Menu Bar -->
        <div id="menu-bar">
            <div class="menu-bar-left">
                <div class="menu-item apple-menu" data-menu="apple">
                    <svg width="14" height="17" viewBox="0 0 14 17" class="apple-logo"><path fill="currentColor" d="M11.07 8.95c-.02-2.06 1.68-3.05 1.76-3.1-1.01-1.47-2.57-1.67-3.12-1.69-1.33-.13-2.59.78-3.26.78-.67 0-1.71-.76-2.82-.74-1.45.02-2.79.84-3.53 2.14-1.5 2.6-.38 6.45 1.08 8.56.71 1.03 1.56 2.18 2.67 2.14 1.07-.04 1.48-.69 2.77-.69 1.29 0 1.66.69 2.79.67 1.15-.02 1.88-1.04 2.58-2.07.81-1.19 1.14-2.34 1.16-2.4-.03-.01-2.22-.85-2.24-3.37zM9.02 3.45c.59-.72.99-1.71.88-2.7-.85.03-1.88.57-2.49 1.28-.55.63-1.03 1.64-.9 2.61.95.07 1.92-.48 2.51-1.19z"/></svg>
                </div>
                <div class="menu-item app-name-menu" data-menu="app"><span id="active-app-name">Finder</span></div>
                <div class="menu-item" data-menu="file">File</div>
                <div class="menu-item" data-menu="edit">Edit</div>
                <div class="menu-item" data-menu="view">View</div>
                <div class="menu-item" data-menu="window">Window</div>
                <div class="menu-item" data-menu="help">Help</div>
            </div>
            <div class="menu-bar-right">
                <div class="menu-item status-item" id="status-battery">
                    <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" ry="3" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/><rect x="3" y="3" width="16" height="7" rx="1" ry="1" fill="currentColor"/><rect x="23" y="4" width="2" height="5" rx="1" fill="currentColor" opacity="0.5"/></svg>
                </div>
                <div class="menu-item status-item" id="status-wifi">
                    <svg width="18" height="14" viewBox="0 0 18 14"><path fill="currentColor" d="M9 3.5c2.4 0 4.6.9 6.3 2.5l1.2-1.3C14.6 2.5 11.9 1.5 9 1.5S3.4 2.5 1.5 4.7l1.2 1.3C4.4 4.4 6.6 3.5 9 3.5zm0 3c1.5 0 2.9.6 3.9 1.6l1.2-1.3C12.8 5.5 11 4.8 9 4.8s-3.8.7-5.1 2l1.2 1.3C6.1 7.1 7.5 6.5 9 6.5zm0 3c.7 0 1.4.3 1.9.8l1.2-1.3c-.8-.8-1.9-1.2-3.1-1.2s-2.3.4-3.1 1.2l1.2 1.3c.5-.5 1.2-.8 1.9-.8z"/></svg>
                </div>
                <div class="menu-item status-item" id="status-search" title="Spotlight Search">
                    <svg width="15" height="15" viewBox="0 0 15 15"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M10 6.5C10 8.4 8.4 10 6.5 10S3 8.4 3 6.5 4.6 3 6.5 3 10 4.6 10 6.5z"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M9 9l4 4"/></svg>
                </div>
                <div class="menu-item status-item" id="status-control-center" title="Control Center">
                    <svg width="17" height="15" viewBox="0 0 17 15"><rect x="1" y="1" width="7" height="6" rx="2" fill="currentColor" opacity="0.9"/><rect x="9" y="1" width="7" height="6" rx="2" fill="currentColor" opacity="0.4"/><rect x="1" y="8" width="7" height="6" rx="2" fill="currentColor" opacity="0.4"/><rect x="9" y="8" width="7" height="6" rx="2" fill="currentColor" opacity="0.9"/></svg>
                </div>
                <div class="menu-item status-item" id="status-datetime">
                    <span id="menu-date"></span>
                    <span id="menu-time"></span>
                </div>
            </div>
        </div>

        <!-- Dropdown Menu Container -->
        <div id="menu-dropdown" class="glass-menu hidden"></div>

        <!-- Context Menu -->
        <div id="context-menu" class="glass-menu context-menu hidden"></div>

        <!-- Windows Container -->
        <div id="windows-container"></div>

        <!-- Dock -->
        <div id="dock-container">
            <div id="dock" class="dock"></div>
        </div>

        <!-- Spotlight -->
        <div id="spotlight-overlay" class="overlay hidden">
            <div class="spotlight-window glass-panel">
                <div class="spotlight-input-row">
                    <svg class="spotlight-icon" width="22" height="22" viewBox="0 0 22 22"><circle cx="9.5" cy="9.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M14 14l5 5"/></svg>
                    <input type="text" id="spotlight-input" placeholder="Spotlight Search" autocomplete="off" spellcheck="false">
                </div>
                <div id="spotlight-results" class="spotlight-results"></div>
            </div>
        </div>

        <!-- Control Center -->
        <div id="control-center-overlay" class="overlay hidden">
            <div class="control-center glass-panel">
                <div class="cc-grid">
                    <div class="cc-tile cc-tile-wide">
                        <div class="cc-tile-inner glass-cc-tile">
                            <div class="cc-row">
                                <div class="cc-pill-group">
                                    <div class="cc-icon-btn cc-active" id="cc-wifi"><svg width="18" height="14" viewBox="0 0 18 14"><path fill="currentColor" d="M9 3.5c2.4 0 4.6.9 6.3 2.5l1.2-1.3C14.6 2.5 11.9 1.5 9 1.5S3.4 2.5 1.5 4.7l1.2 1.3C4.4 4.4 6.6 3.5 9 3.5zm0 3c1.5 0 2.9.6 3.9 1.6l1.2-1.3C12.8 5.5 11 4.8 9 4.8s-3.8.7-5.1 2l1.2 1.3C6.1 7.1 7.5 6.5 9 6.5zm0 3c.7 0 1.4.3 1.9.8l1.2-1.3c-.8-.8-1.9-1.2-3.1-1.2s-2.3.4-3.1 1.2l1.2 1.3c.5-.5 1.2-.8 1.9-.8z"/></svg></div>
                                    <div class="cc-icon-btn" id="cc-bluetooth"><svg width="14" height="20" viewBox="0 0 14 20"><path fill="currentColor" d="M3.5 0v7.5L0 4.5 1 3.5 3.5 5.5V0zm0 12.5V20l-2.5-2L0 17l3.5-2.5zM5 8.5L7 6.5 5 4.5v4zM5 11.5l2-2-2-2v4z" opacity="0.8"/><path fill="currentColor" d="M3.5 0L8 4.5l-2.5 2L8 8.5 3.5 13V8.5L1 11l-1-1 3-2.5-3-2.5 1-1 2.5 2.5V0z" opacity="0.5"/></svg></div>
                                    <div class="cc-icon-btn cc-active" id="cc-airdrop"><svg width="18" height="14" viewBox="0 0 18 14"><path fill="currentColor" d="M9 0C5.7 0 2.8 1.2.7 3.2l1.4 1.4C4 2.8 6.4 2 9 2s5 .8 6.9 2.6l1.4-1.4C15.2 1.2 12.3 0 9 0zm0 4C6.8 4 4.8 4.8 3.2 6.2l1.4 1.4C5.9 6.4 7.4 6 9 6s3.1.4 4.4 1.6l1.4-1.4C13.2 4.8 11.2 4 9 4zm0 4c-1.1 0-2.1.4-2.8 1.1L9 12l2.8-2.9C11.1 8.4 10.1 8 9 8z" opacity="0.9"/></svg></div>
                                </div>
                                <div class="cc-pill-info">
                                    <div class="cc-pill-label" id="cc-wifi-label">Wi-Fi</div>
                                    <div class="cc-pill-sublabel" id="cc-wifi-sublabel">Home</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cc-tile">
                        <div class="cc-tile-inner glass-cc-tile cc-orientation">
                            <div class="cc-orientation-btn cc-active">
                                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="currentColor" d="M9 1L3 9h4v8h4V9h4z"/></svg>
                            </div>
                        </div>
                    </div>

                    <div class="cc-tile cc-tile-wide">
                        <div class="cc-tile-inner glass-cc-tile">
                            <div class="cc-row">
                                <div class="cc-pill-group">
                                    <div class="cc-icon-btn cc-active" id="cc-stage-manager">
                                        <svg width="18" height="14" viewBox="0 0 18 14"><rect x="1" y="1" width="7" height="12" rx="1.5" fill="currentColor" opacity="0.8"/><rect x="10" y="1" width="7" height="12" rx="1.5" fill="currentColor" opacity="0.8"/></svg>
                                    </div>
                                    <div class="cc-icon-btn cc-active" id="cc-screen-mirror">
                                        <svg width="18" height="14" viewBox="0 0 18 14"><rect x="1" y="1" width="16" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M6 13h6"/></svg>
                                    </div>
                                </div>
                                <div class="cc-pill-info">
                                    <div class="cc-pill-label">Display</div>
                                    <div class="cc-pill-sublabel">Built-in Retina</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cc-tile">
                        <div class="cc-tile-inner glass-cc-tile cc-slider-tile">
                            <div class="cc-slider-label"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor" opacity="0.9"/></svg><span>Sun</span></div>
                            <div class="cc-slider-track"><div class="cc-slider-fill" id="cc-brightness-fill" style="height:75%"></div></div>
                        </div>
                    </div>
                    <div class="cc-tile">
                        <div class="cc-tile-inner glass-cc-tile cc-slider-tile">
                            <div class="cc-slider-label"><svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M8 2C5 2 3 4 3 7v3l-1 2h12l-1-2V7c0-3-2-5-5-5z" opacity="0.9"/></svg><span>Sound</span></div>
                            <div class="cc-slider-track"><div class="cc-slider-fill" id="cc-volume-fill" style="height:60%"></div></div>
                        </div>
                    </div>

                    <div class="cc-tile">
                        <div class="cc-tile-inner glass-cc-tile cc-tile-dark" id="cc-now-playing">
                            <div class="cc-np-art"></div>
                            <div class="cc-np-info">
                                <div class="cc-np-title">Liquid Dreams</div>
                                <div class="cc-np-artist">Tahoe Sessions</div>
                            </div>
                            <div class="cc-np-controls">
                                <button class="cc-np-btn">‹</button>
                                <button class="cc-np-btn cc-np-play">▶</button>
                                <button class="cc-np-btn">›</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notification Center -->
        <div id="notification-center" class="overlay hidden">
            <div class="notification-panel glass-panel">
                <div class="nc-widgets">
                    <div class="nc-widget glass-cc-tile">
                        <div class="nc-widget-title">Weather</div>
                        <div class="nc-weather">
                            <div class="nc-weather-temp">68°</div>
                            <div class="nc-weather-cond">Sunny</div>
                            <div class="nc-weather-loc">Cupertino</div>
                            <div class="nc-weather-h">H:72° L:58°</div>
                        </div>
                    </div>
                    <div class="nc-widget glass-cc-tile">
                        <div class="nc-widget-title">Calendar</div>
                        <div class="nc-cal-date" id="nc-cal-date"></div>
                        <div class="nc-cal-events" id="nc-cal-events"></div>
                    </div>
                    <div class="nc-widget glass-cc-tile nc-clock-widget">
                        <div class="nc-clock-time" id="nc-clock-time"></div>
                        <div class="nc-clock-date" id="nc-clock-date"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notifications -->
        <div id="notifications-container"></div>

    </div>

    <!-- Hidden SVG sprite for app icons -->
    <svg id="icon-sprite" style="display:none"></svg>

    <script src="js/core.js"></script>
    <script src="js/menubar.js"></script>
    <script src="js/dock.js"></script>
    <script src="js/spotlight.js"></script>
    <script src="js/controlcenter.js"></script>
    <script src="js/apps.js"></script>
    <script src="js/boot.js"></script>
</body>
</html>
