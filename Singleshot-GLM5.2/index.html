<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>macOS Tahoe</title>
  <link rel="stylesheet" href="css/tahoe.css">
  <link rel="stylesheet" href="css/menubar.css">
  <link rel="stylesheet" href="css/dock.css">
  <link rel="stylesheet" href="css/windows.css">
  <link rel="stylesheet" href="css/apps.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Boot Screen -->
  <div id="boot-screen" class="boot-screen">
    <div class="boot-logo">
      <svg viewBox="0 0 170 170" class="boot-svg" xmlns="http://www.w3.org/2000/svg">
        <path d="M150.37,130.25c-2.45,5.66-5.35,10.87-8.71,15.66c-4.58,6.53-8.33,11.05-11.22,13.56 c-4.48,4.12-9.28,6.23-14.42,6.35c-3.69,0-8.14-1.05-13.32-3.18c-5.19-2.12-9.96-3.17-14.34-3.17c-4.58,0-9.5,1.05-14.76,3.17 c-5.27,2.13-9.52,3.24-12.78,3.35c-4.93,0.21-9.84-1.96-14.75-6.52c-3.13-2.73-7.03-7.41-11.7-14.04 c-5.02-7.08-9.15-15.29-12.39-24.67c-3.46-10.12-5.19-19.92-5.19-29.43c0-10.88,2.35-20.26,7.06-28.12 c3.7-6.31,8.62-11.29,14.78-14.95c6.16-3.66,12.81-5.52,19.97-5.64c3.91,0,9.04,1.21,15.42,3.59 c6.35,2.39,10.42,3.6,12.18,3.6c1.33,0,5.84-1.42,13.48-4.24c7.21-2.61,13.29-3.69,18.25-3.28 c13.5,1.09,23.65,6.41,30.39,16.01c-12.07,7.31-18.04,17.56-17.91,30.71c0.12,10.24,3.82,18.76,11.08,25.51 c3.29,3.13,6.97,5.55,11.08,7.27C155.48,121.13,153.06,125.82,150.37,130.25z M116.53,5.99 c0,8.03-2.93,15.53-8.79,22.48c-7.07,8.26-15.62,13.03-24.87,12.28c-0.12-0.96-0.18-1.97-0.18-3.03 c0-7.71,3.36-15.97,9.34-22.73c2.98-3.42,6.77-6.26,11.37-8.52c4.59-2.22,8.93-3.45,13.01-3.66 C116.44,3.85,116.53,4.92,116.53,5.99z"/>
      </svg>
    </div>
    <div class="boot-progress">
      <div class="boot-progress-bar"></div>
    </div>
  </div>

  <!-- Desktop -->
  <div id="desktop" class="desktop">
    <!-- Desktop wallpaper -->
    <div class="wallpaper" id="wallpaper"></div>

    <!-- Menu Bar -->
    <div id="menu-bar" class="menu-bar"></div>

    <!-- Desktop Icons -->
    <div id="desktop-icons" class="desktop-icons"></div>

    <!-- Window Layer -->
    <div id="window-layer" class="window-layer"></div>

    <!-- Dock -->
    <div id="dock" class="dock-container"></div>

    <!-- Spotlight -->
    <div id="spotlight" class="spotlight-overlay" style="display:none">
      <div class="spotlight-window glass-panel">
        <div class="spotlight-search-bar">
          <svg class="spotlight-icon" width="20" height="20" viewBox="0 0 20 20"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="14" y1="14" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="spotlight-input" placeholder="Spotlight Search" autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
        <div id="spotlight-results" class="spotlight-results"></div>
      </div>
    </div>

    <!-- Control Center -->
    <div id="control-center" class="control-center glass-panel" style="display:none"></div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu glass-panel" style="display:none"></div>

    <!-- Notification Center -->
    <div id="notification-center" class="notification-center" style="display:none"></div>
  </div>

  <script src="js/tahoe.js"></script>
  <script src="js/menubar.js"></script>
  <script src="js/dock.js"></script>
  <script src="js/windowmanager.js"></script>
  <script src="js/apps/finder.js"></script>
  <script src="js/apps/calculator.js"></script>
  <script src="js/apps/notes.js"></script>
  <script src="js/apps/terminal.js"></script>
  <script src="js/apps/safari.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/calendar.js"></script>
  <script src="js/apps/textedit.js"></script>
  <script src="js/apps/weather.js"></script>
  <script src="js/apps/clock.js"></script>
  <script src="js/apps/music.js"></script>
  <script src="js/apps/photos.js"></script>
  <script src="js/apps/maps.js"></script>
  <script src="js/apps/mail.js"></script>
  <script src="js/apps/messages.js"></script>
  <script src="js/apps/about.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
