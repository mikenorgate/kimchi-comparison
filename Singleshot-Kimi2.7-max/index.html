<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>macOS Tahoe</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="desktop">
    <div id="wallpaper"></div>
    <div id="desktop-icons"></div>
    <div id="windows"></div>
  </div>

  <nav id="menu-bar" role="menubar" aria-label="Menu bar">
    <div id="menu-apple" class="menu-item">
      <svg viewBox="0 0 24 24" class="apple-icon"><path d="M18.7 8.8c-.1-1.9 1.6-2.8 1.6-2.9-.9-1.2-2.2-1.4-2.7-1.4-1.1-.1-2.2.7-2.8.7-.6 0-1.5-.7-2.4-.7-2.5 0-4.2 2-4.2 4.1 0 1.6.9 3.3 2.3 4.5.9.9 1.9 1.5 2.9 1.5 1.1 0 1.6-.8 2.7-.8 1.1 0 1.5.8 2.7.8 1.7 0 3.1-1.9 3.6-3.2-2.3-1.1-2.2-3.2-2.2-3.3zM15.9 4.8c.9-1.1.9-2.1.9-2.4-1 .1-2 .7-2.6 1.4-.8.9-1 1.9-1 2.4 1.1.1 2.1-.5 2.7-1.4z"/></svg>
      <div class="menu-dropdown" id="apple-menu"></div>
    </div>
    <div id="menu-app" class="menu-item bold">
      <span id="menu-app-name">Finder</span>
      <div class="menu-dropdown" id="app-menu"></div>
    </div>
    <div class="menu-item">File<div class="menu-dropdown" id="file-menu"></div></div>
    <div class="menu-item">Edit<div class="menu-dropdown" id="edit-menu"></div></div>
    <div class="menu-item">View<div class="menu-dropdown" id="view-menu"></div></div>
    <div class="menu-item">Go<div class="menu-dropdown" id="go-menu"></div></div>
    <div class="menu-item">Window<div class="menu-dropdown" id="window-menu"></div></div>
    <div class="menu-item">Help<div class="menu-dropdown" id="help-menu"></div></div>
    <div id="menu-status" class="menu-status">
      <span id="status-battery">100%</span>
      <span id="status-wifi">Wi-Fi</span>
      <span id="status-time"></span>
      <span id="status-search">🔍</span>
      <span id="status-control">⛭</span>
    </div>
  </nav>

  <div id="dock">
    <div id="dock-apps"></div>
    <div class="dock-separator"></div>
    <div id="dock-trash"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
