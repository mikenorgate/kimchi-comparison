<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>macOS Tahoe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="desktop">
    <div id="wallpaper"></div>

    <div id="menu-bar">
      <div id="menu-left">
        <span id="apple-menu-btn" class="menu-item">&#63743;</span>
        <span id="active-app-name" class="menu-item bold">Finder</span>
        <span class="menu-item">File</span>
        <span class="menu-item">Edit</span>
        <span class="menu-item">View</span>
        <span class="menu-item">Go</span>
        <span class="menu-item">Window</span>
        <span class="menu-item">Help</span>
      </div>
      <div id="menu-right">
        <span class="menu-item" title="Wi-Fi">&#xf8ff;</span>
        <span class="menu-item" title="Battery">100%</span>
        <span class="menu-item" title="Control Center">&#9776;</span>
        <span id="clock" class="menu-item"></span>
      </div>
    </div>

    <div id="desktop-icons"></div>

    <div id="dock">
      <div id="dock-apps"></div>
      <div id="dock-divider"></div>
      <div id="dock-bin"></div>
    </div>

    <div id="context-menu" class="hidden">
      <div class="ctx-item" data-action="new-folder">New Folder</div>
      <div class="ctx-item" data-action="change-wallpaper">Change Wallpaper…</div>
      <div class="ctx-separator"></div>
      <div class="ctx-item" data-action="show-view-options">Show View Options</div>
    </div>

    <div id="windows-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
