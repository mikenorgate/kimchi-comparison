<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>macOS Tahoe</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/apps1.css">
<link rel="stylesheet" href="css/apps2.css">
</head>
<body>
  <!-- Boot splash -->
  <div id="boot">
    <div class="boot-logo"></div>
    <div class="boot-bar"><div class="boot-bar-fill"></div></div>
  </div>

  <!-- Lock screen -->
  <div id="lockscr" hidden>
    <div class="lock-date"></div>
    <div class="lock-time"></div>
    <div class="lock-bottom">
      <div class="lock-avatar">M</div>
      <div class="lock-hint">Press Return or click to log in</div>
    </div>
  </div>

  <!-- Desktop -->
  <div id="desktop" hidden>
    <div id="menubar"></div>
    <div id="dsk-icons"></div>
    <div id="desk-area">
      <div id="desk-click"></div>
      <div id="mc" hidden></div>
    </div>
    <div id="windows"></div>
    <div id="dock-wrap"><div id="dock"></div></div>
    <div id="brightness"></div>
  </div>
  <div id="snap-layer"></div>

  <!-- System overlays -->
  <div id="launchpad" hidden></div>
  <div id="modal-layer"></div>
  <div id="menu-pop" hidden></div>
  <div id="ctx" hidden></div>
  <div id="cc" hidden></div>
  <div id="spot" hidden></div>
  <div id="nc" hidden></div>
  <div id="banners"></div>

  <script src="js/core.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/fs.js"></script>
  <script src="js/wm.js"></script>
  <script src="js/menubar.js"></script>
  <script src="js/systemui.js"></script>
  <script src="js/dock.js"></script>
  <script src="js/apps.core.js"></script>
  <script src="js/apps.sys.js"></script>
  <script src="js/apps.media.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
