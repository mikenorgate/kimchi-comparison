<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>macOS Tahoe</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 170 205'><path d='M150.37 130.25c-.28 32.02 26.13 47.32 27.37 48.06-.15.48-4.28 14.62-14.12 29.2-8.5 12.62-17.32 25.2-31.23 25.5-13.66.25-18.06-8.27-33.7-8.27-15.62 0-20.5 8.02-33.45 8.52-13.4.5-23.62-13.55-32.2-26.13C24.7 206.8 14.05 166.9 25.6 138.4c5.75-14.2 20.18-23.2 35.9-23.4 13.5-.26 26.2 9.1 34.5 9.1 8.27 0 23.78-11.27 40.07-9.62 6.82.28 26 2.75 38.32 20.78-30.7 18.32-31.05 60.74-26.04 76.0z M121.6 65.0c8.6-10.43 14.4-24.9 12.83-39.32-12.4.5-27.43 8.26-36.32 18.66-7.98 9.23-14.97 24.0-13.1 38.13 13.84 1.07 27.98-7.04 36.59-17.47z' fill='black'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/icons.css" />
</head>
<body>
  <!-- Boot / Login screen -->
  <div id="boot-screen" class="boot-screen">
    <div class="boot-logo"></div>
    <div class="boot-progress"><div class="boot-progress-bar"></div></div>
  </div>

  <div id="login-screen" class="login-screen hidden">
    <div class="login-blur"></div>
    <div class="login-card">
      <div class="login-avatar">M</div>
      <div class="login-name">Mike</div>
      <div class="login-password">
        <input type="password" id="login-input" placeholder="Enter Password" autocomplete="off" />
        <button id="login-btn" aria-label="Log in">&#8594;</button>
      </div>
      <div class="login-hint">Press return or click to log in (any password works)</div>
    </div>
    <div class="login-bottom">
      <button class="login-menu" id="sleep-btn">Sleep</button>
      <button class="login-menu" id="restart-btn">Restart</button>
      <button class="login-menu" id="shutdown-btn">Shut Down</button>
    </div>
  </div>

  <!-- Desktop -->
  <div id="desktop" class="desktop hidden">
    <div id="wallpaper" class="wallpaper"></div>
    <div id="desktop-icons" class="desktop-icons"></div>

    <!-- Menu Bar -->
    <div id="menu-bar" class="menu-bar"></div>

    <!-- Window layer -->
    <div id="window-layer" class="window-layer"></div>

    <!-- Spotlight -->
    <div id="spotlight" class="spotlight hidden">
      <div class="spotlight-box">
        <div class="spotlight-input-wrap">
          <span class="spotlight-icon"></span>
          <input type="text" id="spotlight-input" placeholder="Spotlight Search" autocomplete="off" />
        </div>
        <div id="spotlight-results" class="spotlight-results"></div>
      </div>
    </div>

    <!-- Control Center -->
    <div id="control-center" class="control-center hidden"></div>

    <!-- Notification Center / Widgets -->
    <div id="notification-center" class="notification-center hidden"></div>

    <!-- Launchpad -->
    <div id="launchpad" class="launchpad hidden">
      <div class="launchpad-search"><input type="text" id="launchpad-search" placeholder="Search" /></div>
      <div id="launchpad-grid" class="launchpad-grid"></div>
    </div>

    <!-- Dock -->
    <div id="dock" class="dock"></div>

    <!-- Context menu -->
    <div id="context-menu" class="context-menu hidden"></div>

    <!-- Notification toasts -->
    <div id="toasts" class="toasts"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
