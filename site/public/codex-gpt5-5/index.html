<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tahoe Desktop Web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="desktop" class="desktop" aria-label="Tahoe inspired desktop">
    <div class="wallpaper"></div>
    <header class="menu-bar glass" id="menuBar">
      <button class="system-mark menu-trigger" data-menu="system" aria-label="System menu">◆</button>
      <button class="active-app menu-trigger" data-menu="app" id="activeAppMenu">Finder</button>
      <nav class="app-menus" aria-label="Application menus">
        <button class="menu-trigger" data-menu="file">File</button>
        <button class="menu-trigger" data-menu="edit">Edit</button>
        <button class="menu-trigger" data-menu="view">View</button>
        <button class="menu-trigger" data-menu="go">Go</button>
        <button class="menu-trigger" data-menu="window">Window</button>
        <button class="menu-trigger" data-menu="help">Help</button>
      </nav>
      <div class="status-area">
        <button class="status-button" id="focusBtn" title="Focus">Focus</button>
        <button class="status-button" id="wifiBtn" title="Wi-Fi">Wi-Fi</button>
        <button class="status-button" id="batteryBtn" title="Battery">100%</button>
        <button class="status-button" id="spotlightBtn" title="Spotlight">Search</button>
        <button class="status-button" id="controlBtn" title="Control Center">Controls</button>
        <button class="clock" id="clock" title="Notification Center"></button>
      </div>
    </header>

    <main id="windowLayer" class="window-layer" aria-live="polite"></main>

    <section class="desktop-icons" aria-label="Desktop items">
      <button class="desktop-item" data-open="finder"><span class="folder-icon cyan">D</span><span>Desktop</span></button>
      <button class="desktop-item" data-open="notes"><span class="folder-icon coral">N</span><span>Project Notes</span></button>
      <button class="desktop-item" data-open="photos"><span class="folder-icon green">P</span><span>Tahoe Photos</span></button>
    </section>

    <aside class="widgets glass" id="widgets">
      <div class="widget weather">
        <span>South Lake Tahoe</span>
        <strong>58°</strong>
        <small>Clear morning</small>
      </div>
      <div class="widget">
        <span>Calendar</span>
        <strong id="dateTile"></strong>
        <small>Design review 2:30 PM</small>
      </div>
      <div class="widget">
        <span>Live Activity</span>
        <strong>Build</strong>
        <small id="buildStatus">Idle</small>
      </div>
    </aside>

    <nav class="dock glass" id="dock" aria-label="Dock"></nav>

    <div class="popover menu-popover glass" id="menuPopover" hidden></div>
    <div class="spotlight glass" id="spotlight" hidden>
      <input id="spotlightInput" type="search" placeholder="Search apps, files, and actions" autocomplete="off">
      <div id="spotlightResults" class="spotlight-results"></div>
    </div>
    <div class="control-center glass" id="controlCenter" hidden></div>
    <div class="notification-center glass" id="notificationCenter" hidden></div>
    <div class="toast glass" id="toast" hidden></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
