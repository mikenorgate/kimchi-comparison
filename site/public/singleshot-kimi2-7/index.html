<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>macOS Tahoe Web</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/desktop.css" />
  <link rel="stylesheet" href="styles/menubar.css" />
  <link rel="stylesheet" href="styles/dock.css" />
  <link rel="stylesheet" href="styles/window.css" />
  <link rel="stylesheet" href="styles/apps.css" />
  <link rel="stylesheet" href="styles/launchpad.css" />
</head>
<body>
  <div id="boot-screen" class="boot-screen">
    <div class="boot-logo"></div>
    <div class="boot-progress"><div class="boot-progress-bar"></div></div>
  </div>

  <div id="desktop" class="desktop" style="display:none;">
    <div class="wallpaper"></div>
    <div class="desktop-icons" id="desktop-icons"></div>

    <nav id="menubar" class="menubar">
      <div class="menu-left">
        <div class="menu-item apple-menu" data-menu="apple">
          <span class="apple-logo"></span>
          <div class="submenu" id="apple-submenu"></div>
        </div>
        <div class="menu-item app-name" id="active-app-name">Finder</div>
        <div class="menu-items" id="app-menus"></div>
      </div>
      <div class="menu-right">
        <div class="menu-item status-icons">
          <span>🔊</span><span>🔋</span><span>Wi-Fi</span>
        </div>
        <div class="menu-item" id="clock">Mon 12:00 PM</div>
      </div>
    </nav>

    <main id="window-layer" class="window-layer"></main>

    <section id="launchpad" class="launchpad" style="display:none;">
      <div class="launchpad-search">
        <input type="text" placeholder="Search" id="launchpad-search" />
      </div>
      <div class="launchpad-grid" id="launchpad-grid"></div>
    </section>

    <footer id="dock" class="dock">
      <div class="dock-apps" id="dock-apps"></div>
      <div class="dock-separator"></div>
      <div class="dock-trash" id="dock-trash" title="Trash">🗑️</div>
    </footer>
  </div>

  <div id="context-menu" class="context-menu" style="display:none;"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
